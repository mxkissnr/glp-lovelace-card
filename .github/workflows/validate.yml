name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: plugin

  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fetch glp-order-card.js for shared-block sync test (#74)
        # Only the raw file is needed (byte comparison of marked blocks) --
        # no full checkout, so it can live outside github.workspace where
        # node --test's default recursive discovery would otherwise pick up
        # glp-order-card's own test suite, including a Playwright e2e test
        # whose browser binary isn't installed here (hung CI for 8+ min,
        # see #83).
        run: curl -fsSL -o "${{ runner.temp }}/glp-order-card.js" https://raw.githubusercontent.com/mxkissnr/glp-order-card/main/glp-order-card.js

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Install Playwright Chromium
        # apt-get (triggered by --with-deps) has hung indefinitely before when
        # the runner's regional Ubuntu mirror was unreachable (#138) -- a short
        # per-attempt timeout + retry lets a single mirror hiccup self-heal
        # within this run instead of needing a manual rerun.
        run: |
          for attempt in 1 2 3; do
            if timeout 300 npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "Playwright install attempt $attempt/3 failed or timed out, retrying..."
            sleep 10
          done
          echo "::error::Playwright Chromium install failed after 3 attempts"
          exit 1

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test:coverage
        env:
          GLP_ORDER_CARD_PATH: ${{ runner.temp }}/glp-order-card.js

      - name: Build check (syntax)
        run: npm run build
