name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: plugin

  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout neighbor repo (glp-order-card) for shared-block sync test (#74)
        uses: actions/checkout@v7
        with:
          repository: mxkissnr/glp-order-card
          path: .neighbor-glp-order-card

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test:coverage
        env:
          GLP_ORDER_CARD_PATH: ${{ github.workspace }}/.neighbor-glp-order-card/glp-order-card.js

      - name: Build check (syntax)
        run: npm run build
