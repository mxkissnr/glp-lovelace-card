name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: plugin

  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch glp-order-card.js for shared-block sync test (#74)
        # Only the raw file is needed (byte comparison of marked blocks) --
        # no full checkout, so it can live outside github.workspace where
        # node --test's default recursive discovery would otherwise pick up
        # glp-order-card's own test suite, including a Playwright e2e test
        # whose browser binary isn't installed here (hung CI for 8+ min,
        # see #83).
        run: curl -fsSL -o "${{ runner.temp }}/glp-order-card.js" https://raw.githubusercontent.com/mxkissnr/glp-order-card/main/glp-order-card.js

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test:coverage
        env:
          GLP_ORDER_CARD_PATH: ${{ runner.temp }}/glp-order-card.js

      - name: Build check (syntax)
        run: npm run build
